name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", "1.98"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Run tests
        run: |
          cargo +${{ matrix.toolchain }} test --all-targets
          cargo +${{ matrix.toolchain }} test --doc
      - name: Run Clippy
        run: |
          rustup component add clippy --toolchain ${{ matrix.toolchain }}
          cargo +${{ matrix.toolchain }} clippy --all-targets -- -D warnings
